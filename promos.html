<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="css/promos.css">
    <script src="js/promos.js" type="module"></script>
    <script src="js/navigation.js"></script>
    <script type="module">
        import { fetchTypes } from './js/dbService.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            const types = await fetchTypes();
            console.log('Loaded types:', types);
        });
    </script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="app-brand">
                <img src="media/logo.webp" alt="Crystal" class="app-logo">
                <span class="app-name">Crystal</span>
            </div>
            <ul>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="carousels.html">Carousels</a></li>
                <li><a href="promos.html">Promos</a></li>
                <li><a href="check.html">Check</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header-container">
            <div class="title-section">
                <h1>Promo Codes</h1>
            </div>
            <div class="navigation-buttons">
                <button class="btn btn-new" id="newPromoBtn">
                    <span>+</span> New Promo
                </button>
            </div>
        </div>

        <div class="filters-section">
            <div class="filter-group">
                <label for="codeFilter">Promo Code:</label>
                <input type="number" id="codeFilter" class="filter-input" placeholder="Enter code">
            </div>
            <div class="filter-group">
                <label for="productNameFilter">Product Name:</label>
                <input type="text" id="productNameFilter" class="filter-input" placeholder="Enter name">
            </div>
            <div class="filter-group">
                <label for="groupFilter">Group:</label>
                <select id="groupFilter" class="filter-input">
                    <option value="Unknown">Unknown</option>
                    <option value="Modern">Modern</option>
                    <option value="Old School">Old School</option>
                    <option value="Retro">Retro</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="makerFilter">Maker:</label>
                <select id="makerFilter" class="filter-input">
                    <option value="Unknown">Unknown</option>
                    <option value="Sony">Sony</option>
                    <option value="Atari">Atari</option>
                    <option value="Sega">Sega</option>
                    <option value="Nintendo">Nintendo</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="promoTypeFilter">Promo Type:</label>
                <select id="promoTypeFilter" class="filter-input">
                    <option value="All">All Types</option>
                    <option value="Product">Product</option>
                    <option value="Group">Group</option>
                    <option value="Maker">Maker</option>
                </select>
            </div>
            
        </div>
        <div id="productList" class="product-list">
            <!-- Products here -->
        </div>
    </div>
    <div class="side-navigation">
        <button id="sidePrevBtn" class="side-nav-btn side-nav-prev">
            <span>←</span>
        </button>
        <button id="sideNextBtn" class="side-nav-btn side-nav-next">
            <span>→</span>
        </button>
    </div>
</body>
</html>
