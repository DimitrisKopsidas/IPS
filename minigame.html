<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigame</title>
    <link rel="stylesheet" href="css/minigame.css">
    <script type="module" src="js/minigame.js"></script>
</head>
<body>
    <!-- Add the countdown timer -->
    <div class="countdown-timer inactivity" id="countdownTimer">
        <div class="timer-icon"></div>
        <span id="timerText">--:--</span>
    </div>
    
    <div class="separator" id="leftSep"></div>
    <div class="wheel-wrapper"></div>
    <div class="separator" id="rightSep"></div>
    <div class="content-wrapper">
        <div class="instructions-container">
            <img src="media/hand.png" class="prize-image" id="hand">
            <p class="instructions-text">Spin the wheel using your hand and win promotional discounts to redeem in store!</p>
        </div>
    </div> 
</body>
</html>
