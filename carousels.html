<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="css/carousels.css">
    <script src="js/carousels.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="app-brand">
                <img src="media/logo.webp" alt="Crystal" class="app-logo">
                <span class="app-name">Crystal</span>
            </div>
            <ul>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="carousels.html">Carousels</a></li>
                <li><a href="promos.html">Promos</a></li>
                <li><a href="check.html">Check</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header-container">
            <div class="title-section">
                <h1>Carousels</h1>
            </div>
            <div class="navigation-buttons">
                <button class="btn btn-new" id="newPromoBtn">
                    <span>+</span> New Carousel
                </button>
            </div>
        </div>
        <div class="filters-section">
            <div class="filter-group">
                <label for="codeFilter">Code:</label>
                <input type="number" id="codeFilter" class="filter-input" placeholder="Enter code">
            </div>
            <div class="filter-group">
                <label for="nameFilter">Name:</label>
                <input type="text" id="nameFilter" class="filter-input" placeholder="Enter name">
            </div>
            <div class="filter-group">
                <label for="activeFilter">Show only active:</label>
                <select id="activeFilter" class="filter-input">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="makerFilter">Items per page:</label>
                <select id="itemsPerPage" class="filter-input">
                    <option value="2">2</option>
                    <option value="4">5</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>
        <div id="productList" class="product-list">
            <!-- Products here -->
        </div>
    </div>
    <div class="side-navigation">
        <button id="sidePrevBtn" class="side-nav-btn side-nav-prev">
            <span>←</span>
        </button>
        <button id="sideNextBtn" class="side-nav-btn side-nav-next">
            <span>→</span>
        </button>
    </div>
</body>
</html>
