<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product</title>
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/upload.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="admin.html">Admin</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="carousels.html">Carousels</a></li>
            <li><a href="promos.html">Promos</a></li>
            <li><a href="check.html">Check</a></li>
        </ul>
    </nav>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Products</a>
        
        <h1>Upload New Product</h1>
        
        <div class="upload-container">
            <!-- Product Image Upload Section -->
            <div class="image-upload-section">
                <div class="upload-preview" id="imagePreview">
                    <img src="https://via.placeholder.com/300x300?text=Product+Image" alt="Product image preview" id="previewImage">
                </div>
                <div class="upload-controls">
                    <label for="productImage" class="btn btn-secondary">Choose Image</label>
                    <input type="file" id="productImage" accept="image/*" hidden>
                    <p class="upload-help">Recommended size: 800x800px, Max: 2MB</p>
                </div>
            </div>
            
            <!-- Product Details Form Section -->
            <div class="product-form-section">
                <form id="productUploadForm">
                    <div class="form-group">
                        <label for="productName">Product Name*</label>
                        <input type="text" id="productName" name="productName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="productPrice">Price ($)*</label>
                        <input type="number" id="productPrice" name="productPrice" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="productDescription">Description*</label>
                        <textarea id="productDescription" name="productDescription" rows="5" required></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productSKU">SKU*</label>
                            <input type="text" id="productSKU" name="productSKU" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="productInventory">Inventory Quantity*</label>
                            <input type="number" id="productInventory" name="productInventory" min="0" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="productSpecs">Specifications</label>
                        <div class="specs-container" id="specsContainer">
                            <div class="spec-item">
                                <input type="text" class="spec-input" placeholder="e.g. Bluetooth 5.0">
                                <button type="button" class="btn-remove-spec">✕</button>
                            </div>
                        </div>
                        <button type="button" id="addSpecBtn" class="btn btn-secondary btn-small">+ Add Specification</button>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="saveAsDraftBtn">Save as Draft</button>
                        <button type="submit" class="btn btn-primary" id="publishProductBtn">Publish Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/upload.js"></script>
</body>
</html>
